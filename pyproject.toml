[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "streamforge"
version = "0.1.0"
description = "Event-driven data platform: ingest, validate, transform, store, serve and observe."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Praneetha Potharaju" }]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "jsonschema>=4.21,<5",
  "pyyaml>=6,<7",
  "fastapi>=0.111,<1",
  "uvicorn>=0.30,<1",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
pubsub = ["google-cloud-pubsub>=2.21,<3"]
otel = ["opentelemetry-api>=1.25,<2"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "httpx>=0.27,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "types-PyYAML",
  "types-jsonschema",
  "pre-commit>=3.7,<5",
]

[project.scripts]
streamforge = "streamforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/streamforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["streamforge"]
branch = true
omit = ["src/streamforge/adapters/pubsub_queue.py", "src/streamforge/adapters/postgres_store.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/streamforge"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*", "opentelemetry.*"]
ignore_missing_imports = true
